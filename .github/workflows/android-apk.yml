# DEEYOUNG PRO — free native Android build (GitHub Actions, free tier).
# Produces an installable APK on every push that touches the workflow or
# capacitor config. Download from the run's "Artifacts" section, sideload
# or publish to Google Play later. No paid service involved.
name: android-apk

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["capacitor.config.ts", ".github/workflows/android-apk.yml"]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor + Android platform (build-time only)
        run: |
          npm install --no-save @capacitor/core @capacitor/cli @capacitor/android
          npx cap add android || true

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: deeyoung-pro-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
