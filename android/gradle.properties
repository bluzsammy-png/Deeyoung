# JVM args tuned for a 4GB machine: single JVM, modest heap.
org.gradle.jvmargs=-Xmx1280m -XX:MaxMetaspaceSize=448m -Dfile.encoding=UTF-8 -XX:+UseSerialGC
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.caching=true
org.gradle.daemon=false
# Compile Kotlin inside the Gradle JVM (no separate Kotlin daemon: they OOM together on small boxes)
kotlin.compiler.execution.strategy=in-process
kotlin.daemon.jvmargs=-Xmx1024m
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# ── DeeYoung Pro configuration ────────────────────────────────────────────────
# Release base URL: the always-on Railway origin. deyoungpro.site DNS was
# broken at app-authoring time; when the apex record is restored you can point
# this at https://deyoungpro.site with zero code changes.
DEEYOUNG_BASE_URL_RELEASE=https://deyoung-production.up.railway.app
# Debug builds talk to a local Next.js dev server on the host machine.
DEEYOUNG_BASE_URL_DEBUG=http://10.0.2.2:3000

# ── Optional FCM activation (free Firebase project required) ─────────────────
# Leave empty to ship without Firebase (default). To activate background push:
#  1. Create a free Firebase project, add an Android app with package
#     com.deeyoungs.pro, download google-services.json into android/app/.
#  2. Uncomment the google-services plugin in app/build.gradle.kts.
#  3. Set FCM_APPLICATION_ID / FCM_PROJECT_ID / FCM_API_KEY here and rebuild.
# The app registers the token at POST /api/mobile/push automatically when set.
FCM_APPLICATION_ID=
FCM_PROJECT_ID=
FCM_API_KEY=
